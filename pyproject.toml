# The PyPI distribution of pypackpack. The wheel carries the native command line (GraalVM Native
# Image) and is assembled per platform by .github/scripts/pypi/build_wheel.py in publish-pypi.yml,
# which reads [project] below. Its version must equal cli/build.gradle.kts's: the workflow refuses
# to publish unless the installed binary prints it.
#
# Building from source (`pip install .`) gives only the Python package, without the binary; `ppp`
# then says so and exits.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypackpack"
version = "0.2.0"
description = "PyPackPack (PPP) - A multiplatform solution to distribute python project"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "thisisthepy", email = "thisisthepy@gmail.com" },
]
keywords = ["packaging", "cross-compilation", "android", "ios", "kotlin-multiplatform", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ppp = "pypackpack.__main__:main"

[project.urls]
Homepage = "https://github.com/thisisthepy/pypackpack"
Documentation = "https://thisisthepy.github.io/pypackpack/"
Repository = "https://github.com/thisisthepy/pypackpack"
Issues = "https://github.com/thisisthepy/pypackpack/issues"

[tool.setuptools]
package-dir = { pypackpack = "packpack/src/main/python" }
packages = ["pypackpack"]
